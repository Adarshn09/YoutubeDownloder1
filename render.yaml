services:
  - type: web
    name: youtube-downloader
    env: python
    buildCommand: |
      apt-get update && apt-get install -y --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install --upgrade yt-dlp
    startCommand: gunicorn -w 2 -k gthread -t 180 -b 0.0.0.0:$PORT app:app
    plan: free
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-downloader-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: YTDL_CACHE_DIR
        value: /tmp/ytdl-cache
      # Optionally set cookies/proxy to reduce YouTube bot checks
      # - key: YTDLP_COOKIES_B64
      #   value: "..."
      # - key: HTTP_PROXY
      #   value: "http://user:pass@host:port"
      # - key: HTTPS_PROXY
      #   value: "http://user:pass@host:port"

databases:
  - name: youtube-downloader-db
    plan: free
    databaseName: youtube_downloader
